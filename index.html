<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>경기장 좌석 배치 · 사석 관리</title>
<style>
:root{
  --bg:#0E1319; --panel:#161D25; --panel2:#1D2731; --line:#2B3947;
  --ink:#EAF0F6; --mute:#8DA0B2; --faint:#5E6E7E;
  --maple:#D89A5C; --held:#E24A4A; --view:#F2C744; --cons:#3D8FD6; --tbl:#B77BC7; --pick:#4DD0E1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(120% 80% at 50% -10%,#19242F 0%,transparent 62%),var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1340px;margin:0 auto;padding:16px 18px 60px}

/* 경기장 탭 */
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.vtab{border:0;background:transparent;color:var(--faint);font:inherit;font-size:14px;font-weight:700;
  padding:12px 18px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;letter-spacing:-.01em}
.vtab:hover{color:var(--mute)}
.vtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--maple)}
.vtab small{display:block;font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.1em;margin-top:2px}
.vtab[aria-selected="true"] small{color:var(--maple)}

.board{position:relative;border:1px solid #30404F;border-radius:14px;overflow:hidden;
  background:linear-gradient(#0B0F13,#141B22);box-shadow:0 16px 42px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(rgba(255,255,255,.05) .6px,transparent .7px);background-size:4px 4px}
.board-in{position:relative;z-index:1;padding:16px 20px}
.eyebrow{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;font-size:11px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.eyebrow b{color:var(--maple);letter-spacing:.16em}
h1{margin:6px 0 14px;font-size:clamp(17px,3vw,23px);font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--mute);font-weight:500;font-size:.62em;letter-spacing:0;margin-left:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:1 1 105px;background:#070A0D;border:1px solid #263240;border-radius:9px;padding:9px 12px 8px}
.stat .k{font-size:9.5px;letter-spacing:.12em;color:var(--faint)}
.stat .v{font-size:clamp(18px,3.4vw,25px);font-weight:700;line-height:1.15;margin-top:2px;text-shadow:0 0 14px currentColor}
.stat .d{font-size:10px;color:var(--faint);margin-top:1px;min-height:12px}
.stat .d b{color:var(--maple)}
.c1{color:#EBD6A8}.c2{color:#FF7B7B}.c3{color:#FFDE7A}.c4{color:#8FC4F0}.c5{color:#84E2BE}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 11px}
.seg{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:7px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--maple);color:#1A1206}
.seg.paint button[aria-pressed="true"][data-tool="held"]{background:var(--held);color:#fff}
.seg.paint button[aria-pressed="true"][data-tool="free"]{background:#3E8F6E;color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--mute);font:inherit;font-size:12px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:#3E5266}
.btn.warn:hover{color:#FF9B9B;border-color:#6A3235}
.spacer{flex:1}
.syncst{font-size:11px;color:var(--faint);white-space:nowrap}
.syncst.on{color:#7BE3B0}
:focus-visible{outline:2px solid var(--pick);outline-offset:2px}

.grid{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:15px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel2)}
.card-h h2{margin:0;font-size:13px;font-weight:700}
.card-h .sub{font-size:11.5px;color:var(--faint)}

.plan{overflow:auto;max-height:80vh;position:relative;background:#FAF8F4}
.plan.grab{cursor:grab}.plan.grabbing{cursor:grabbing}
.plan svg{display:block;height:auto;width:calc(100% * var(--z,1));min-width:calc(600px * var(--z,1))}
.zoom{display:flex;align-items:center;gap:3px;margin-left:auto}
.zoom button{width:26px;height:24px;border:1px solid var(--line);background:var(--panel);color:var(--mute);
  font:inherit;font-size:13px;font-weight:700;border-radius:6px;cursor:pointer;line-height:1;padding:0}
.zoom button:hover{color:var(--ink);border-color:#3E5266}
.zoom .lv{font-size:11px;color:var(--faint);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.zoom .fit{width:auto;padding:0 8px;font-size:11px}
.zone{cursor:pointer}
.zone .zh{fill:transparent;stroke:transparent;stroke-width:3}
.zone:hover .zh{stroke:rgba(23,34,45,.5)}
.zone.on .zh{stroke:var(--pick);stroke-width:3.5}
.zone.dim{opacity:.16;pointer-events:none}
/* 배경 없는 도면: 좌석 점이 곧 구역 */
.zone .zh{fill:transparent}
.zl{font-weight:800;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.8);stroke-width:2.6px}
.zs{font-weight:700;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.8);stroke-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 15px;padding:10px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.detail{padding:13px 15px 16px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:290px;color:var(--faint);text-align:center;font-size:13px;line-height:1.7}
.empty b{color:var(--mute);font-size:14px;font-weight:700}
.dh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dh .zid{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tag2{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.dm{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:9px 0 11px}
.dm b{color:var(--ink)}.dm .r{color:#FF8A8A}.dm .y{color:#FFD95E}.dm .cn{color:#8FC4F0}
.zbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stage{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto auto;justify-content:center;align-items:center;gap:6px}
.ct{font-size:9.5px;letter-spacing:.3em;color:var(--maple);white-space:nowrap;text-align:center}
.ct.v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.12em}
/* 정규화 상세(잠실): 코트가 항상 위 */
.stage2{display:inline-grid;grid-template-columns:auto auto;gap:7px 6px;align-items:start;justify-items:start;max-width:100%}
.courtbar{background:linear-gradient(180deg,#E9B87E,#D9A76A);color:#59371B;font-weight:800;font-size:11px;
  letter-spacing:.22em;text-align:center;padding:5px 0 4px;border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.courtbar small{display:block;font-size:8px;letter-spacing:.34em;font-weight:700;color:#7A4E24;margin-top:1px}
.courtnote{font-size:10px;color:var(--faint);text-align:center;margin-top:4px;line-height:1.5}
.rlcol{display:flex;flex-direction:column}
.rlcol span{color:var(--faint);font-size:9px;line-height:1;display:flex;align-items:center;justify-content:flex-end;white-space:nowrap}
.gaterow{display:flex;gap:8px}
.gaterow .gb{font-size:10px;font-weight:700;color:#FF9BAF;background:#2A171D;border:1px solid #5C2B36;
  border-radius:20px;padding:3px 9px;white-space:nowrap}
.sg{display:grid;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{border-radius:2px;background:#33414F;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:var(--fs);font-weight:800;color:#A9BACA;line-height:1}
.sq.y,.sq.c{color:#0B1218}
.sq.x{color:#FFD9D9}
.sq.w{background:#8FD9BC;color:#0B3A2A;cursor:default}
.sq.p{background:#EFDA6E;color:#4A3A05}
.sq.rv{background:var(--pick);color:#04353C}
.sq.pend{box-shadow:inset 0 0 0 2px #4DD0E1;background:#173F47;color:#7FE3F2}
.rvbar{display:flex;flex-direction:column;gap:7px;margin-bottom:11px}
.rvrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rvrow input{flex:1 1 150px;min-width:0}
.rvlab{font-size:10.5px;font-weight:700;color:var(--faint);flex:0 0 52px}
.rvsw{display:inline-flex;gap:4px;align-items:center;flex:0 0 auto}
.rvs-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 0;border-top:1px dashed #2C3A48}
.rvs-row:first-of-type{border-top:0}
.rvs-dot{width:11px;height:11px;border-radius:4px;flex:0 0 auto}
.rvs-name{font-size:13px;color:var(--ink)}
.rvs-tot{font-size:12px;font-weight:700;color:var(--mute)}
.rvs-z{border:1px solid;background:#0D1319;font:inherit;font-size:11px;font-weight:700;border-radius:16px;padding:3px 10px;cursor:pointer}
.rvs-z:hover{background:#141D26}
/* 팀(단체) 간단 화면 */
.teambar .chk-body{padding:13px 16px 15px}
.teamrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px}
.teamchip{border:1.5px solid;background:#0D1319;font:inherit;font-size:13px;font-weight:700;border-radius:20px;padding:7px 14px;cursor:pointer}
.teamchip b{font-weight:800}
.teamchip.on{background:#152430;outline:2px solid currentColor;outline-offset:1px}
.teamchip .tdel{color:var(--faint);font-weight:800}
.teamadd{display:flex;gap:7px;flex-wrap:wrap}
.teamadd input{flex:1 1 240px;min-width:0}
.tbar-stats{margin-top:10px;font-size:13px;color:var(--mute)}
.simple .zbtns .seg{display:none}
.simple #mlog{display:none}
.simple .phz{display:none}
.cw{width:16px;height:16px;border-radius:5px;border:2px solid transparent;cursor:pointer;padding:0}
.cw.on{border-color:#FFFFFF;box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.sq.y{background:var(--view)}
.sq.c{background:var(--cons)}
.sq.x{background:var(--held)}
.sq.ed::after{content:"";position:absolute;inset:0;border:1.2px solid #fff;border-radius:2px;opacity:.8}
.tipbar{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.65}
.tipbar b{color:var(--ink)}
.chk{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.chk-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.chk-h h2{margin:0;font-size:13px;font-weight:700}
.vp-links{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.vp-links .ext{font-size:11.5px;font-weight:600;color:#8FC4F0;text-decoration:none;
  border:1px solid #2E4356;background:#111A22;border-radius:7px;padding:6px 10px;white-space:nowrap}
.vp-links .ext:hover{color:#BFE0FA;border-color:#3E5266}
.chk-body{padding:13px 16px 15px}
.vpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;margin-bottom:13px}
@media(max-width:640px){.vpgrid{grid-template-columns:1fr}}
.vpc{position:relative;margin:0}
.vpc img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#0A0E12;
  border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.vpc img:hover{border-color:#3E5266}
.vpx{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:7px;border:1px solid #4A3237;
  background:rgba(10,12,15,.85);color:#FF9B9B;font-size:15px;line-height:1;cursor:pointer;padding:0}
.vpx:hover{background:#2A1418}
#lb{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(6,9,12,.94);padding:26px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.7)}
#lb .lbx{position:absolute;top:16px;right:20px;background:transparent;border:0;color:#EAF0F6;
  font-size:30px;line-height:1;cursor:pointer;padding:4px 10px}
#lb .lbn{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:11.5px;color:#8DA0B2}
.vpfail{display:none;flex-direction:column;gap:5px;align-items:flex-start;justify-content:center;
  min-height:150px;padding:16px;border:1px dashed #45525F;border-radius:10px;background:#0D1319}
.vpfail b{font-size:12.5px;color:#FF9B9B;font-weight:700}
.vpfail span{font-size:11.5px;color:var(--faint);line-height:1.6}
.vpfail a{font-size:11.5px;color:#8FC4F0;text-decoration:none;border:1px solid #2E4356;background:#111A22;
  border-radius:7px;padding:5px 9px;margin-top:2px}
.vpc.bad img,.phwrap.bad img{display:none}
.vpc.bad .vpfail,.phwrap.bad .vpfail{display:flex}
.phwrap{position:relative;margin-bottom:7px}
.phwrap .vpfail{min-height:96px}
.vpempty{font-size:12px;color:var(--faint);line-height:1.7;margin-bottom:11px}
.vpadd{display:flex;gap:7px;flex-wrap:wrap}
.vpurl{flex:1 1 240px;min-width:0;background:#0C1116;border:1px solid var(--line);border-radius:8px;
  color:var(--ink);font:inherit;font-size:12px;padding:8px 10px}
.vpurl:focus{outline:none;border-color:#3E5266}
.vpurl::placeholder{color:#4E5B68}
.mlog{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.mlog h3{margin:0 0 7px;font-size:11px;letter-spacing:.08em;color:var(--maple);font-weight:700}
.mnone{font-size:11.5px;color:var(--faint);line-height:1.6}
.ml{padding:7px 0;border-top:1px dashed #2C3A48}
.ml:first-of-type{border-top:0}
.ml-t{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:11.5px;color:var(--mute)}
.ml-t b{color:var(--ink)}
.ml-t .tm{color:var(--faint);font-size:10.5px}
.ml-t .seats{color:var(--faint);font-size:10.5px;flex:1 1 100%;line-height:1.5}
.mnote{width:100%;margin-top:5px;background:#0C1116;border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:inherit;font-size:12px;padding:7px 9px}
.mnote:focus{outline:none;border-color:#3E5266}
.mnote::placeholder{color:#4E5B68}
.phz{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.ph-h{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.ph-h h3{margin:0;font-size:11px;letter-spacing:.08em;color:var(--maple);font-weight:700}
.ph-h .ext{margin-left:auto;font-size:11.5px;font-weight:600;color:#8FC4F0;text-decoration:none;
  border:1px solid #2E4356;background:#111A22;border-radius:7px;padding:5px 9px}
.ph-h .ext:hover{color:#BFE0FA;border-color:#3E5266}
.phimg{display:block;width:100%;max-height:230px;object-fit:cover;border-radius:8px;border:1px solid var(--line);margin-bottom:7px}
.phurl{width:100%;background:#0C1116;border:1px solid var(--line);border-radius:7px;color:var(--ink);
  font:inherit;font-size:12px;padding:7px 9px}
.phurl:focus{outline:none;border-color:#3E5266}
.phurl::placeholder{color:#4E5B68}
.phnote{font-size:10.5px;color:var(--faint);line-height:1.6;margin-top:5px}
.notes{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 15px}
.notes h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.1em;color:var(--maple);font-weight:700}
.notes ul{margin:0;padding-left:17px;font-size:12.2px;line-height:1.85;color:var(--mute)}
#tip{position:fixed;pointer-events:none;z-index:60;opacity:0;transition:opacity .1s;background:#000;
  border:1px solid #3A4854;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="vtabs" role="tablist" id="vtabs"></div>
  <div id="app"></div>
</div>

     +'<text x="'+t[0].toFixed(1)+'" y="'+(t[1]+3.4).toFixed(1)+'" text-anchor="middle" font-size="9" font-weight="800" fill="#4A5560">GATE '+(i+1)+'</text></g>';
  });
  (E.texts||[]).forEach(t=>{s+='<text x="'+t.x+'" y="'+t.y+'" text-anchor="middle" font-size="'+t.fs+'" font-weight="700" fill="'+t.f+'">'+t.t+'</text>';});
  v.zones.forEach(z=>{
    const st=zStat(v,z);
    let d,px,py,thin=false,f1=13.5,f2=9.5;
    if(z.geo.k==='box'){const[x,y,w,h]=z.geo.v;px=x+w/2;py=y+h/2;
      const rot=z.geo.rot||0;
      if(rot){const RA=rot*Math.PI/180,RCo=Math.cos(RA),RSi=Math.sin(RA);
        const cs=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].map(p=>{const dx=p[0]-px,dy=p[1]-py;return[(px+dx*RCo-dy*RSi).toFixed(1),(py+dx*RSi+dy*RCo).toFixed(1)];});
        d='M'+cs.map(p=>p[0]+' '+p[1]).join('L')+'Z';}
      else d='M'+x+' '+y+'h'+w+'v'+h+'h'+(-w)+'Z';
      thin=(h<26); if(w<44&&!rot){f1=10.5;f2=8;}}
    else{d=arcSector(z.geo.rr,z.geo.a,z.geo.sp,(v.key==='jc')?0.5:0.9);const p=rp((z.geo.rr[0]+z.geo.rr[1])/2,z.geo.a);px=p[0];py=p[1];thin=(z.geo.sp<=10);}
    const tc='#273240';

    s+='<g class="zone" data-z="'+z.id+'" tabindex="0" role="button" aria-label="'+z.id+' 구역 잔여 '+st.o+'석">'
      +(z.geo.k==='box'?'':'<path d="'+d+'" fill="none" stroke="#55636F" stroke-opacity=".55" stroke-width="1"/>')   /* 1층 블록(장충)은 회색 네모 테두리 없이 좌석 점만 */
      +'<g class="dots">'+zoneDots(v,z)+'</g>'
      +'<text class="zl" font-size="'+(thin?11:f1)+'" x="'+px.toFixed(1)+'" y="'+(py+(thin?4:-2)).toFixed(1)+'" fill="'+tc+'">'+z.id+'</text>'
      +(thin?'':'<text class="zs" font-size="'+f2+'" x="'+px.toFixed(1)+'" y="'+(py+10).toFixed(1)+'" fill="'+tc+'" opacity=".9">'+st.o+'석</text>')
      +((z.tag&&!thin)?'<text font-size="6.8" font-weight="800" text-anchor="middle" x="'+px.toFixed(1)+'" y="'+(py+19.5).toFixed(1)+'" fill="'+z.tag.c+'">'+z.tag.t+'</text>':'')
      +dots+'<path class="zh" d="'+d+'"/></g>';
  });
  /* 구역 위 덧그림(전광판 등) */
  (E.over||[]).forEach(x=>{
    const p=rp((x.rr[0]+x.rr[1])/2,x.a);
    s+='<path d="'+arcSector(x.rr,x.a,x.sp,0)+'" fill="#10151A" stroke="#46596B" stroke-width="1.2"/>'
     +'<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+2.8).toFixed(1)+'" text-anchor="middle" font-size="7.5" font-weight="800" fill="#9FD1FF">'+x.t+'</text>';
  });
  /* 1층 출입구 가~라 배지 (잠실학생체육관) */
  if(v.key==='sk'){
    /* 메인 게이트(2층 로비): 오른쪽에 붙은 웨지 + 진입 화살표 */
    s+='<path d="M852 434 L952 396 L952 544 L852 506 Z" fill="#FFC61A" stroke="#E0A400" stroke-width="1.5"/>'
     +'<path d="M882 450 L860 470 L882 490" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>'
     +'<text x="917" y="464" text-anchor="middle" font-size="12" font-weight="800" fill="#C8102E">메인 게이트</text>'
     +'<text x="917" y="480" text-anchor="middle" font-size="9.5" font-weight="700" fill="#C8102E">(2층 로비)</text>';
    Object.keys(GATE_ANG).forEach(nm=>{
      const p=rp(180,GATE_ANG[nm]);
      s+='<g><title>'+nm+' 출입구 (1층)</title>'
       +'<rect x="'+(p[0]-13).toFixed(1)+'" y="'+(p[1]-8).toFixed(1)+'" width="26" height="16" rx="4" fill="#FFE3EA" stroke="#E03131" stroke-width="1.1"/>'
       +'<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.5).toFixed(1)+'" text-anchor="middle" font-size="8.5" font-weight="800" fill="#C8102E">'+nm+'</text></g>';
    });
    /* 2층 로비 1~10 출입구 — 3층 구역 사이 계단 통로 위 */
    GATE_NUM.forEach(g=>{
      const p=rp(330,g[1]);
      s+='<g><title>'+g[0]+'번 출입구 (2층 로비)</title>'
       +'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="9.5" fill="#FFC61A" stroke="#C8102E" stroke-width="1.6"/>'
       +'<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3.6).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="800" fill="#C8102E">'+g[0]+'</text></g>';
    });
  }
  return s+'</svg>';
}

/* 표시용 열 인덱스: flip 구역은 좌우 반전(1번 좌석이 항상 왼쪽) */
const cIdx=(z,s)=> z.flip ? (z.nC-1-s.c) : s.c;
/* 도면에서 보이는 방향 그대로:
   위쪽 구역(=도면에서 코트가 구역 아래) → 코트 아래, 1열 아랫줄, 1번 왼쪽
   아래쪽 구역(a>180, =도면에서 코트가 구역 위) → 코트 위, 1열 윗줄, 1번 오른쪽 */
const flipUp=z=>z.geo&&(z.geo.k==='sec'?z.geo.a>180:z.face==='N');
function place(v,z,s){
  if(flipUp(z)) return [s.r, z.nC-1-cIdx(z,s)];
  return [z.nR-1-s.r, cIdx(z,s)];
}
function dims(v,z){ return [z.nR,z.nC]; }
function rowLabel(v,z,s){ return z.rl?z.rl[s.r]:((s.r+1)+'열'); }

function seatTxt(v,z,s,H){

}

const ZL=[0.8,1,1.25,1.6,2,2.5,3.2,4,5,6.5,8];
function setZoom(z){
  const v=VEN[CUR]; v.z=Math.min(8,Math.max(0.8,z));
  const el=document.getElementById('plan'); if(!el)return;
  el.style.setProperty('--z',String(v.z));
  el.dataset.dots = v.z<1.25?'lo':(v.z<2?'mid':'hi');
  el.classList.toggle('grab',v.z>1);
  const lv=document.getElementById('zlv'); if(lv)lv.textContent=Math.round(v.z*100)+'%';
}
function stepZoom(dir,ax,ay){
  const v=VEN[CUR]; let i=ZL.findIndex(x=>x>=v.z-0.001);
  if(i<0)i=ZL.length-1;
  i=Math.min(ZL.length-1,Math.max(0,i+dir));
  const el=document.getElementById('plan'), old=v.z;
  if(el&&ax===undefined){ax=el.clientWidth/2;ay=el.clientHeight/2;}
  setZoom(ZL[i]);
  if(el&&v.z!==old){const k=v.z/old;
    el.scrollLeft=(el.scrollLeft+ax)*k-ax; el.scrollTop=(el.scrollTop+ay)*k-ay;}
}

function getTeams(v){
  const m=new Map();
  (v.teams||[]).forEach(t=>m.set(t.name,{name:t.name,col:t.col,count:0}));
  v.rsv.forEach(e=>{const n=(e.note||'').trim(); if(!n)return;
    if(!m.has(n))m.set(n,{name:n,col:e.col||'#4DD0E1',count:0});
    m.get(n).count+=e.k.length;});
  return Array.from(m.values());
}

function parseSpec(v,z,txt){
  const keys=[];
  const usable=s=>s.b!=='w'&&!held(v,z,s)&&!isRv(v,z,s)&&!PEND.has(KEY(z,s));
  const mc=txt.match(/^(\d{1,3})\s*석$/);
  if(mc){
    let need=+mc[1];
    const rows={}; z.seats.forEach(s=>{(rows[s.r]=rows[s.r]||[]).push(s);});
    const order=Object.keys(rows).map(Number).sort((a,b)=>a-b);   /* 앞열(1열)부터 채움 */
    for(const r of order){ if(!need)break;
      rows[r].slice().sort((p,q)=>cIdx(z,p)-cIdx(z,q)).forEach(s=>{
        if(need&&usable(s)){keys.push(KEY(z,s));need--;}});
    }
    if(need>0) return {keys:keys,err:'가용 좌석이 '+keys.length+'석뿐이라 전부 선택했습니다'};
    return {keys:keys};
  }
  const segs=txt.split(/[\/;]+/);
  for(const seg of segs){
    if(!seg.trim())continue;
    const m=seg.match(/(\d+)\s*열\s*(.+)/);
    if(!m) return {err:'형식: 3열 1~5 / 7열 2,3 / 20석'};
    const r=+m[1]-1, nums=[];
    m[2].split(/[,\s]+/).forEach(tok=>{ if(!tok)return;
      const mr=tok.match(/^(\d+)\s*[~\-]\s*(\d+)\s*번?$/);
      if(mr){for(let n=+mr[1];n<=+mr[2];n++)nums.push(n);}
      else{const mo=tok.match(/^(\d+)\s*번?$/); if(mo)nums.push(+mo[1]);}
    });
    if(!nums.length) return {err:m[1]+'열 좌석 번호를 확인해 주세요'};
    for(const n of nums){
      const s=z.seats.find(x=>x.r===r&&x.n===n&&x.b!=='w');
      if(!s) return {err:(r+1)+'열 '+n+'번 좌석이 없습니다'};
      if(held(v,z,s)) return {err:(r+1)+'열 '+n+'번은 사석입니다'};
      if(isRv(v,z,s)) return {err:(r+1)+'열 '+n+'번은 이미 지정석입니다'};
      keys.push(KEY(z,s));
    }
  }
  return {keys:keys};
}

const CRC=(function(){const t=new Uint32Array(256);

function zipStore(files){
  const enc=new TextEncoder(),u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const parts=[],cen=[];let off=0;

    const nm=enc.encode(f.name),d=f.data,crc=CRC(d),sz=d.length;
    const lh=new Uint8Array([].concat([80,75,3,4],u16(20),u16(2048),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0)));
    parts.push(lh,nm,d); cen.push({nm:nm,crc:crc,sz:sz,off:off}); off+=lh.length+nm.length+sz;
  });
  const cd=[];let cl=0;
  cen.forEach(c=>{
    const h=new Uint8Array([].concat([80,75,1,2],u16(20),u16(20),u16(2048),u16(0),u16(0),u16(0),
      u32(c.crc),u32(c.sz),u32(c.sz),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off)));
    cd.push(h,c.nm); cl+=h.length+c.nm.length;
  });
  const eo=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(cen.length),u16(cen.length),u32(cl),u32(off),u16(0)));
  const all=parts.concat(cd,[eo]);let n=0;all.forEach(a=>n+=a.length);

    });
  });
  const chg=[[{v:'구분',s:1},{v:'구역',s:1},{v:'열',s:1},{v:'좌석번호',s:1}]];
  v.zones.forEach(z=>z.seats.forEach(s=>{if(ed(v,z,s))chg.push([held(v,z,s)?'사석 추가':'사석 해제',z.id,rowLabel(v,z,s),s.n]);}));
  if(chg.length===1)chg.push(['변경 없음','','','']);
  const mm=[[{v:'시각',s:1},{v:'구역',s:1},{v:'지정 좌석 수',s:1},{v:'좌석',s:1},{v:'메모',s:1}]];

  if(mm.length===1)mm.push(['기록 없음','','','','']);

function saveState(){
  const o={app:'arena-seatmap',ver:1,savedAt:new Date().toISOString(),venues:{}};
  KEYS.forEach(k=>{o.venues[k]={ov:Array.from(VEN[k].ov.entries()),done:Array.from(VEN[k].done),log:VEN[k].log,photos:VEN[k].photos,vphotos:VEN[k].vphotos,rsv:VEN[k].rsv,teams:VEN[k].teams||[]};});
  dl('좌석_사석설정_'+STAMP()+'.json',JSON.stringify(o,null,1),'application/json');
}
function loadState(file,done){
  const fr=new FileReader();
  fr.onload=()=>{try{
    const o=JSON.parse(fr.result);
    if(!o||!o.venues)throw 0;
    KEYS.forEach(k=>{const x=o.venues[k]||{};
      VEN[k].ov=new Map(cleanOv(VEN[k],Array.isArray(x)?x:(x.ov||[])));
      VEN[k].done=new Set(Array.isArray(x)?[]:(x.done||[]));
      VEN[k].log=(Array.isArray(x)?[]:(x.log||[])).map(e=>({t:e.t,zid:e.zid,k:e.k||null,seats:e.seats||e.add||[],note:e.note||''}));
      VEN[k].photos=(Array.isArray(x)?{}:(x.photos||{}));
      VEN[k].vphotos=(Array.isArray(x)?[]:(x.vphotos||[]));
      VEN[k].rsv=(Array.isArray(x)?[]:(x.rsv||[])).map(e=>({t:e.t,zid:e.zid,k:e.k||[],note:e.note||'',col:e.col||''}));
      VEN[k].teams=(Array.isArray(x)?[]:(x.teams||[])).map(t=>({name:t.name,col:t.col||'#4DD0E1'}));
      cleanRsv(VEN[k]); pruneLog(VEN[k]);});
    done(null,o.savedAt);
  }catch(e){done('파일을 읽지 못했습니다. 저장 버튼으로 만든 JSON 파일인지 확인해 주세요.');}};
  fr.onerror=()=>done('파일을 읽지 못했습니다.');
  fr.readAsText(file);
}

      document.addEventListener('click',b,{capture:true,once:true});}

  app.addEventListener('wheel',e=>{
    const el=e.target.closest('.plan'); if(!el)return;

    stepZoom(e.deltaY<0?1:-1, e.clientX-r.left, e.clientY-r.top);

const LSKEY='volleyball-seatmap-v4';   /* 0807 최종 반영판(MBC 보라 · 팬엔터 청록) — 이전 기기 저장본과 섞이지 않게 키 변경 */
/* ── 시간대별 버전 기록(이 기기 브라우저 보관, 비밀번호 잠금) ── */
const HKEY='volleyball-seatmap-hist-v1', HPW='0429';
let HISTOK=false, HISTSRV=null, HPWIN='';
async function loadSrvHist(){
  if(!shared)return;
  try{
    const r=await fetch('api/state?versions=1&pw='+encodeURIComponent(HPWIN),{cache:'no-store'});
    if(!r.ok)return;
    const j=await r.json();
    if(j&&j.versions){ HISTSRV=j.versions; refreshHist(); }
  }catch(e){}
}
function takeSnapshot(){
  try{
    const o=packState();
    let h=[]; try{h=JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){}
    const now=Date.now(), bucket=Math.floor(now/600000);   /* 10분 단위 */
    const cur=JSON.stringify(o.venues);
    const last=h[h.length-1];
    if(last&&last.b===bucket){ last.t=now; last.d=cur; }
    else h.push({t:now,b:bucket,d:cur});
    while(h.length>72)h.shift();                            /* 최근 72개(약 12시간 연속 편집분) */
    localStorage.setItem(HKEY,JSON.stringify(h));
  }catch(e){}
}
function histPanelHTML(){
  let h='<div class="chk" id="histpanel"><div class="chk-h"><h2 style="color:#F2C744">버전 기록</h2>'
    +'<div class="sub">수정할 때마다 10분 단위로 자동 스냅샷 · 비밀번호 필요</div></div><div class="chk-body">';
  if(!HISTOK){
    h+='<div class="teamadd"><input class="vpurl" id="histpw" type="password" placeholder="비밀번호" style="max-width:180px" autocomplete="off">'
      +'<button class="btn" id="histunlock">열기</button><span class="syncst" id="histmsg"></span></div>';
  }else if(HISTSRV&&HISTSRV.length){
    /* 공유 저장소(서버/깃허브) 버전 — 모든 기기 공통 */
    h+=HISTSRV.slice().sort((a,b)=>b.t-a.t).map(sn=>{
      const m=sn.meta||{};
      const sum=sn.sum||((m.teams!=null)?(m.teams+'팀 · 지정석 '+(m.rv||0)+'석 · 수동 사석변경 '+(m.ov||0)+'건'):'');
      return '<div class="rvs-row"><b class="rvs-name">'+new Date(sn.t).toLocaleString('ko-KR')+'</b>'
        +'<span class="rvs-tot">'+esc(sum)+'</span>'
        +'<button class="btn" data-hsr="'+(sn.id||sn.t)+'" style="padding:3px 10px;font-size:11px">이 버전으로 복원</button></div>';
    }).join('');
    h+='<div class="phnote">공유 저장소(깃허브 data/state.json 커밋 이력)에 보관된 버전입니다 — 모든 기기 공통, 비밀번호 아는 사람만 조회. 복원하면 현재 상태를 덮어쓰고, 복원 직후 상태도 새 커밋으로 저장됩니다.</div>';
  }else{
    let hist=[]; try{hist=JSON.parse(localStorage.getItem(HKEY)||'[]');}catch(e){}
    if(!hist.length) h+='<div class="vpempty">아직 저장된 버전이 없습니다. 좌석을 수정하면 자동으로 쌓입니다.</div>';
    else h+=hist.slice().reverse().map((sn,ri)=>{
      const i=hist.length-1-ri; let sum='';
      try{const d=JSON.parse(sn.d), sk=d.sk||{};
        const rvs=(sk.rsv||[]).reduce((a,e)=>a+(e.k||[]).length,0);
        sum=((sk.teams||[]).length)+'팀 · 지정석 '+rvs+'석 · 수동 사석변경 '+((sk.ov||[]).length)+'건';
      }catch(e){}
      return '<div class="rvs-row"><b class="rvs-name">'+new Date(sn.t).toLocaleString('ko-KR')+'</b>'
        +'<span class="rvs-tot">'+sum+'</span>'
        +'<button class="btn" data-hrestore="'+i+'" style="padding:3px 10px;font-size:11px">이 버전으로 복원</button>'
        +'<button class="btn" data-hdl="'+i+'" style="padding:3px 10px;font-size:11px">JSON 내려받기</button></div>';
    }).join('');
    h+='<div class="phnote">이 버전 목록은 이 브라우저(내 기기) 보관분입니다. 공유 저장소(api/state)가 연결되면 서버 보관 버전이 대신 표시됩니다.</div>';
  }
  return h+'</div></div>';
}
function refreshHist(){
  const p=document.getElementById('histpanel');
  if(p){const t=document.createElement('div');t.innerHTML=histPanelHTML();p.replaceWith(t.firstElementChild);}
}
const DATAREV=20260824;   /* 도면 기준일(0823 1·2층 배정표 반영, 2차) — 이보다 오래된 공유 저장 데이터는 무시하고 새 도면 데이터로 덮어씀 */
function packState(){const o={ver:1,rev:DATAREV,updatedAt:Date.now(),venues:{}};
  KEYS.forEach(k=>{o.venues[k]={ov:Array.from(VEN[k].ov.entries()),done:Array.from(VEN[k].done),log:VEN[k].log,photos:VEN[k].photos,vphotos:VEN[k].vphotos,rsv:VEN[k].rsv,teams:VEN[k].teams||[]};});
  return o;}
/* 좌석 배치가 바뀐 뒤 남은 옛 좌표의 지정값은 버림 */
function cleanOv(v,ents){return (ents||[]).filter(e=>{
  const q=String(e[0]).split('#'); if(q.length<2)return false;
  const z=v.zones.find(x=>x.id===q[0]); if(!z)return false;
  const rc=q[1].split('_');
  return z.seats.some(s=>s.r==rc[0]&&s.c==rc[1]&&s.b!=='w');});}
function applyState(o){ if(!o||!o.venues)return false;
  KEYS.forEach(k=>{const x=o.venues[k]||{};
    VEN[k].ov=new Map(cleanOv(VEN[k],x.ov)); VEN[k].done=new Set(x.done||[]);
    VEN[k].log=(x.log||[]).map(e=>({t:e.t,zid:e.zid,k:e.k||null,seats:e.seats||e.add||[],note:e.note||''}));
    VEN[k].photos=x.photos||{}; VEN[k].vphotos=x.vphotos||[];
    /* 저장 데이터에 rsv/teams 항목이 아예 없으면(예전 저장본) 도면에 내장된 기본 지정석(MBC·팬엔터)을 유지 */
    VEN[k].rsv=x.rsv?x.rsv.map(e=>({t:e.t,zid:e.zid,k:e.k||[],note:e.note||'',col:e.col||''})):(VEN[k].rsv||[]);
    VEN[k].teams=x.teams?x.teams.map(t=>({name:t.name,col:t.col||'#4DD0E1'})):(VEN[k].teams||[]);
    cleanRsv(VEN[k]); pruneLog(VEN[k]);});
  return true;}
let shared=false,lastLocal=0,lastSeen=0,pushTimer=null,pushing=false;
function syncBadge(txt,ok){const el=document.getElementById('syncst');
  if(el){el.textContent=txt;el.className='syncst'+(ok?' on':'');}}
function schedulePersist(){ lastLocal=Date.now();
  try{localStorage.setItem(LSKEY,JSON.stringify(packState()));}catch(e){}
  takeSnapshot();
  if(!shared){syncBadge('이 기기 브라우저에 자동 저장됨',false);return;}
  clearTimeout(pushTimer); pushTimer=setTimeout(pushState,3000);   /* 깃허브 커밋 저장이라 3초로 모아서 전송 */
  syncBadge('공유 저장 중…',true);}
async function pushState(){ if(pushing){pushTimer=setTimeout(pushState,800);return;}
  pushing=true;
  try{const o=packState();
    const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
    if(r.ok){lastSeen=o.updatedAt;const d=new Date();
      syncBadge('공유 저장소에 저장됨 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),true);}
    else{
      let why=''; try{const j=await r.json(); if(j&&j.error)why=' · 원인: '+String(j.error).slice(0,120);}catch(x){}
      syncBadge('공유 저장 실패('+r.status+')'+why+' — 이 기기에만 저장됨',false);
    }
  }catch(e){syncBadge('공유 저장 실패 — 이 기기에만 저장됨',false);}
  pushing=false;}
async function pullState(first){
  try{const r=await fetch('api/state',{cache:'no-store'}); if(!r.ok)throw 0;
    const o=await r.json();
    shared=true;
    if(o&&o.venues&&(o.rev||0)<DATAREV){
      /* 공유 저장소에 예전 도면 기준 데이터가 남아 있음 → 받지 않고 이번 도면 데이터(0807 사석·MBC·팬엔터)로 덮어씀 */
      syncBadge('공유 저장소의 옛 데이터를 새 도면 기준으로 갱신 중…',true);
      pushState();
    }else if(o&&o.venues){
      if(first||(o.updatedAt!==lastSeen&&!painting&&Date.now()-lastLocal>10000)){
        applyState(o); lastSeen=o.updatedAt||0; render();
      }
      if(first)syncBadge('공유 저장소 연결됨 — 모두 같은 현황을 봅니다',true);
    }else{
      /* 서버가 비어 있으면 이 기기 저장분으로 시드 */
      try{const raw=localStorage.getItem(LSKEY);
        if(raw&&applyState(JSON.parse(raw))){render();schedulePersist();}
        else syncBadge('공유 저장소 연결됨(빈 상태)',true);
      }catch(x){syncBadge('공유 저장소 연결됨(빈 상태)',true);}
    }
  }catch(e){ if(first){shared=false;
    try{const raw=localStorage.getItem(LSKEY);
      if(raw&&applyState(JSON.parse(raw)))render();}catch(x){}
    syncBadge('이 기기 브라우저에 자동 저장됨',false);}}
}
window.arenaSync={pull:pullState,push:pushState};
tabs(); render();
pullState(true);
setInterval(()=>{if(shared&&!document.hidden)pullState(false);},15000);
})();
</script>
