<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>티켓 검증 · 신인감독 김연경2</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{font-family:'GmarketSans';font-weight:700;font-display:swap;
  src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}
:root{--orange:#e97132;--navy:#1b1760;--navy-deep:#0e0b3d;
  --disp:'GmarketSans','Pretendard',sans-serif;--body:'Pretendard',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);background:var(--navy-deep);color:#fff;min-height:100dvh;
  padding:max(24px,env(safe-area-inset-top)) 16px 48px;
  background-image:radial-gradient(120% 60% at 50% -10%, #2a2380 0%, var(--navy-deep) 62%)}
.wrap{max-width:420px;margin:0 auto}
.head{text-align:center;margin-bottom:20px}
.head img{width:86px}
.head h1{font:700 18px var(--disp);margin-top:10px}
.head p{font-size:12.5px;color:#a4a0cf;margin-top:6px}
.card{background:#fff;color:#26243f;border-radius:18px;padding:22px 20px;box-shadow:0 16px 44px rgba(5,3,30,.5)}
label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:7px}
input{width:100%;border:1.5px solid #dcd9ea;border-radius:12px;padding:13px 14px;
  font:700 18px var(--disp);letter-spacing:.08em;color:#221f3d;background:#fbfaff;outline:none;text-transform:uppercase}
input:focus-visible{border-color:var(--orange);box-shadow:0 0 0 3px rgba(233,113,50,.18)}
button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:14px;background:var(--navy);
  color:#fff;font:700 15px var(--disp);cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
button:disabled{opacity:.5}
#out{margin-top:18px;display:none;border-radius:18px;padding:22px 20px}
#out.ok{display:block;background:#e9f8ee;color:#14522b;border:2px solid #2fa45c}
#out.bad{display:block;background:#fdeeea;color:#7c1d10;border:2px solid #d84a2c}
#out .big{font:700 19px var(--disp);display:flex;align-items:center;gap:8px}
#out .name{font:700 30px var(--disp);color:var(--navy);margin-top:12px}
#out ul{list-style:none;margin-top:8px}
#out li{font:700 17px var(--disp);color:#26243f;padding:6px 0;border-bottom:1px dashed #bcd8c5}
#out li:last-child{border-bottom:0}
#out .hint{font-size:12.5px;margin-top:12px;line-height:1.6}
.secpat{display:flex;align-items:center;gap:7px;margin-top:12px;font:800 13px var(--body)}
.secpat i{width:14px;height:14px;border-radius:99px;display:inline-block}
#out li{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#out li .seat{flex:1;min-width:120px}
#out li .st{font:700 11.5px var(--body);color:#8a6d3b}
#out li .st.in{color:#14522b}
#out li button.tg{border:0;border-radius:8px;padding:7px 11px;font:700 11.5px var(--body);cursor:pointer;
  background:var(--navy);color:#fff;width:auto;margin:0}
#out li button.tg.off{background:#c2401d}
.staffbox{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.staffbox input{flex:1;min-width:120px;font:700 14px var(--body);letter-spacing:normal;text-transform:none;padding:10px 12px}
.staffbox button{width:auto;margin:0;padding:10px 14px;font-size:13px}
.staffbox button.ghostb{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.staffmsg{width:100%;font:600 12px var(--body);color:#7c1d10}
.foot{margin-top:26px;text-align:center;color:#7672ab;font-size:11.5px;line-height:1.7}
</style>
</head>
<body>
<div id="netBar" style="display:none;position:sticky;top:0;z-index:60;background:#8a4b12;color:#fff;font:700 11.5px 'Pretendard',sans-serif;text-align:center;padding:8px 12px">📡 오프라인 — 입장 처리는 연결되면 자동 반영됩니다</div>
<div class="wrap">
  <div class="head">
    <img src="assets/logo.png" alt="">
    <h1>스태프용 티켓 검증</h1>
    <p>관람객 티켓의 QR을 스캔했거나, 티켓 하단의 확인코드를 입력하세요.</p>
  </div>

  <div class="card">
    <form id="form" autocomplete="off">
      <label for="inCode">확인코드 (8자리)</label>
      <input id="inCode" placeholder="예) 5VD7-2ZR4" maxlength="9" autocapitalize="characters" spellcheck="false">
      <button id="btn" type="submit">검증하기</button>
    </form>
  </div>

  <div id="out" role="status"></div>

  <p class="foot">이 페이지의 정보와 관람객 화면의 <b>이름·구역·좌석·코드</b>가 모두 일치하고,<br>관람객 화면의 시계가 실시간으로 움직이면 정상 티켓입니다.</p>
</div>

<script src="assets/config.js"></script>
<script src="assets/ticket-crypto.js"></script>
<script>
(function(){
'use strict';
var CFG = window.TICKET_CONFIG, T = window.TCrypto;
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch(e){} }
function updateNetBar(){ document.getElementById('netBar').style.display = (navigator.onLine === false) ? 'block' : 'none'; }
window.addEventListener('online', function(){ updateNetBar(); flushQ(); refreshStates(); });
window.addEventListener('offline', updateNetBar);
var QKEY = 'kyk2Q:' + CFG.salt;
function readQ(){ try { return JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch(e){ return []; } }
function writeQ(q){ try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch(e){} }
function enqueueOn(code, z, s){
  var q = readQ().filter(function(x){ return !(x.c === code && x.z === z && x.s === s); });
  q.push({ c: code, z: z, s: s, t: Date.now() });
  writeQ(q);
}
var flushing = false;
function flushQ(){
  if (flushing || navigator.onLine === false) return;
  var q = readQ();
  if (!q.length) return;
  flushing = true;
  (function next(){
    var q2 = readQ();
    if (!q2.length){ flushing = false; refreshStates(); return; }
    var it = q2[0];
    apiCheckin({ action:'set', code: it.c, z: it.z, s: it.s, on: true }).then(function(){
      writeQ(readQ().slice(1)); next();
    }).catch(function(e){
      if (e.status === 404){ writeQ(readQ().slice(1)); next(); }
      else { flushing = false; }
    });
  })();
}
setInterval(flushQ, 20000);
setTimeout(updateNetBar, 0);
var $ = function(s){ return document.querySelector(s); };
var DB = null, dbErr = null;
/* ── 검증 조회: 전체 명단을 받지 않고 확인코드로 유도한 레코드 1건만 요청.
   스태프 세션(staffTk)을 실어 레이트리밋 면제(현장 대량 스캔 대비). 오프라인 대비 로컬 캐시. ── */
function recCacheKey(id){ return 'kyk2box:' + CFG.salt + ':' + id; }
function fetchBox(id){
  return fetch('/api/db', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ event: CFG.salt, id: id, tk: staffTk || undefined })
  }).then(function(r){ if (!r.ok) throw 0; return r.json(); })
    .then(function(j){
      var box = j && j.box;
      if (box) { try { localStorage.setItem(recCacheKey(id), JSON.stringify(box)); } catch(e){} }
      return box || null;
    }).catch(function(){
      try { var s = localStorage.getItem(recCacheKey(id)); if (s) return JSON.parse(s); } catch(e){}
      return null;
    });
}

function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escA(s){ return esc(s).replace(/"/g,'&quot;'); }
function zoneText(z){ z=String(z||'').trim(); return /구역/.test(z)?z:z+' 구역'; }
function seatText(s){ s=String(s||'').trim(); return /좌석/.test(s)?s:s+' 좌석'; }
function fmtTs(ts){ return new Date(ts).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hourCycle:'h23'}); }

function apiCheckin(payload){
  return fetch('/api/checkin', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(Object.assign({ event: CFG.salt }, payload))
  }).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if (!r.ok){ var e=new Error(j.error||('HTTP '+r.status)); e.code=j.error; e.status=r.status; throw e; }
      return j;
    });
  });
}

var curCode = '', pollT = null, checkinOff = false;
var staffPw = '', staffTk = '';
try {
  staffPw = sessionStorage.getItem('kyk2StaffPw') || '';
  staffTk = sessionStorage.getItem('kyk2StaffTk') || '';
} catch(e){}
function staffAuthed(){ return !!(staffPw || staffTk); }

function show(ok, html){
  var o = $('#out'); o.className = ok ? 'ok' : 'bad'; o.innerHTML = html;
}

function renderStaffBox(){
  var sb = $('#sb'); if (!sb) return;
  if (checkinOff){ sb.innerHTML=''; return; }
  if (staffAuthed()){
    sb.innerHTML = '<button type="button" id="sbAll">전체 입장 처리</button>' +
      '<button type="button" id="sbLock" class="ghostb">스태프 잠금</button><div class="staffmsg" id="sbMsg"></div>';
  } else {
    sb.innerHTML = '<button type="button" id="sbUnlock" class="ghostb">스태프 모드 열기 (입장 처리)</button><div class="staffmsg" id="sbMsg"></div>';
  }
  var tgs = document.querySelectorAll('#out li .tg');
  for (var i=0;i<tgs.length;i++) tgs[i].style.display = staffAuthed() ? '' : 'none';
}
function sbErr(m){ var el=$('#sbMsg'); if(el) el.textContent=m; }

function renderStates(seats){
  var lis = document.querySelectorAll('#out li');
  for (var i=0;i<lis.length;i++){
    var li=lis[i], z=li.dataset.z, s=li.dataset.s, hit=null;
    for (var k=0;k<seats.length;k++) if (seats[k].z===z && seats[k].s===s){ hit=seats[k]; break; }
    var st=li.querySelector('.st'), tg=li.querySelector('.tg');
    if (hit && hit.ts){
      st.textContent='✓ '+fmtTs(hit.ts)+' 입장'; st.classList.add('in');
      tg.textContent='취소'; tg.classList.add('off'); tg.dataset.on='1';
    } else {
      st.textContent='미입장'; st.classList.remove('in');
      tg.textContent='입장'; tg.classList.remove('off'); tg.dataset.on='';
    }
  }
}
function refreshStates(){
  if (!curCode || checkinOff) return;
  apiCheckin({ action:'status', code: curCode }).then(function(j){
    if (j.now) timeOffset = j.now - Date.now();
    renderStates(j.seats||[]);
  }).catch(function(e){
    if (e.status===404 || e.code==='redis_env_missing'){
      checkinOff = true;
      var els=document.querySelectorAll('#out li .st, #out li .tg');
      for (var i=0;i<els.length;i++) els[i].style.display='none';
      renderStaffBox();
      if (pollT){ clearInterval(pollT); pollT=null; }
    }
  });
}

function check(codeRaw){
  var code = T.normCode(codeRaw);
  if (code.length < 8){ show(false, '<div class="big">✕ 코드 8자리를 입력하세요</div>'); return; }
  var btn = $('#btn'); btn.disabled = true;
  T.deriveVerify(code, CFG).then(function(d){
    return fetchBox(d.id).then(function(box){
      if (!box) throw 0;
      return T.decryptJSON(d.key, box);
    });
  }).then(function(p){
    curCode = code; checkinOff = false;
    var seats = p.t.map(function(tk){
      return '<li data-z="'+escA(String(tk.z||'').trim())+'" data-s="'+escA(String(tk.s||'').trim())+'">' +
        '<span class="seat">'+esc(zoneText(tk.z))+' · '+esc(seatText(tk.s))+(tk.b?' <b>('+esc(tk.b)+')</b>':'')+'</span>' +
        '<span class="st">확인 중…</span>' +
        '<button type="button" class="tg" style="display:none">입장</button></li>';
    }).join('');
    show(true,
      '<div class="big">✔ 정상 발권된 티켓</div>' +
      '<div class="name">' + esc(p.n) + '</div>' +
      '<ul>' + seats + '</ul>' +
      '<div class="staffbox" id="sb"></div>' +
      '<div class="secpat" id="vPat"></div>' +
      '<div class="hint">관람객 화면의 이름·좌석·코드(<b>' + T.fmtCode(code) + '</b>)와 일치하는지, 시계가 움직이는지, <b>보안 패턴(색·단어)</b>이 위와 같은지 확인하세요. 셋 중 하나라도 다르면 캡처·위조입니다.</div>');
    renderStaffBox();
    refreshStates();
    if (pollT) clearInterval(pollT);
    pollT = setInterval(function(){ if (!document.hidden) refreshStates(); }, 12000 + Math.floor(Math.random() * 4000));
  }).catch(function(e){
    if (e === 'db') show(false, '<div class="big">✕ 데이터 로드 실패</div><div class="hint">네트워크 연결을 확인한 뒤 새로고침해 주세요.</div>');
    else show(false, '<div class="big">✕ 등록되지 않은 코드</div><div class="hint">발권된 적 없는 코드입니다. <b>위조 티켓일 수 있으니</b> 명단(스태프 확인용 엑셀)과 대조해 주세요.</div>');
  }).finally(function(){ btn.disabled = false; });
}

function setSeat(li, on, doneCb){
  apiCheckin({ action:'set', pw: staffPw || undefined, tk: staffTk || undefined, code: curCode, z: li.dataset.z, s: li.dataset.s, on: on })
    .then(function(j){
      if (on && j && j.already)
        sbErr('⚠ ' + li.dataset.z + ' ' + li.dataset.s + ' — 이미 ' + fmtTs(j.ts) + '에 입장 처리된 좌석입니다. 중복 입장 시도 여부를 확인하세요.');
      if (doneCb) doneCb();
      refreshStates();
    })
    .catch(function(e){
      if (on && (!e.status || e.status >= 500)){
        /* 입장 처리는 오프라인 큐로 — 연결 시 자동 반영 */
        enqueueOn(curCode, li.dataset.z, li.dataset.s);
        var st = li.querySelector('.st');
        st.textContent = '✓ 입장 (동기화 대기)'; st.classList.add('in');
        sbErr('네트워크가 없어 기기에 저장했습니다. 연결되면 자동 반영됩니다. (대기 ' + readQ().length + '건)');
        if (doneCb) doneCb();
        return;
      }
      if (e.status===401){ staffPw=''; staffTk=''; try{sessionStorage.removeItem('kyk2StaffPw');sessionStorage.removeItem('kyk2StaffTk');}catch(x){} renderStaffBox(); sbErr('인증이 만료되었습니다. 스태프 모드를 다시 열어주세요.'); }
      else sbErr('처리 실패: ' + (e.code==='redis_env_missing' ? '서버 저장소 미설정' : (e.message||'네트워크 오류')));
    });
}

$('#out').addEventListener('click', function(ev){
  var t = ev.target;
  if (t.classList && t.classList.contains('tg')){
    var li = t.closest('li'); var on = !t.dataset.on;
    if (!on && !window.confirm('이 좌석의 입장을 취소할까요?')) return;
    setSeat(li, on);
    return;
  }
  if (t.id === 'sbUnlock'){
    $('#sb').innerHTML = '<input type="password" id="sbPw" inputmode="numeric" maxlength="12" placeholder="스태프 비밀번호">' +
      '<button type="button" id="sbGo">확인</button><div class="staffmsg" id="sbMsg"></div>';
    $('#sbPw').focus();
    return;
  }
  if (t.id === 'sbGo'){
    var pw = $('#sbPw').value.trim();
    if (!pw) return sbErr('비밀번호를 입력해 주세요.');
    t.disabled = true;
    fetch('/api/admin', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'verify', scope:'staff', pw: pw, event: CFG.salt }) })
    .then(function(r){
      if (r.ok){
        return r.json().catch(function(){ return {}; }).then(function(j){
          if (j.session){ staffTk = j.session; staffPw = '';
            try{ sessionStorage.setItem('kyk2StaffTk', j.session); sessionStorage.removeItem('kyk2StaffPw'); }catch(e){}
          } else { staffPw = pw; staffTk = '';
            try{ sessionStorage.setItem('kyk2StaffPw', pw); }catch(e){} }
          renderStaffBox(); refreshStates();
        });
      }
      else if (r.status===401) sbErr('비밀번호가 올바르지 않습니다.');
      else sbErr('서버 오류 (' + r.status + ')');
    }).catch(function(){ sbErr('서버에 연결하지 못했습니다.'); })
    .finally(function(){ t.disabled = false; });
    return;
  }
  if (t.id === 'sbAll'){
    if (!window.confirm('이 코드의 미입장 좌석을 전부 입장 처리할까요?')) return;
    var lis = document.querySelectorAll('#out li');
    var targets = [];
    for (var i=0;i<lis.length;i++){ if (!lis[i].querySelector('.tg').dataset.on) targets.push(lis[i]); }
    (function next(i){
      if (i >= targets.length){ refreshStates(); return; }
      setSeat(targets[i], true, function(){ next(i+1); });
    })(0);
    return;
  }
  if (t.id === 'sbLock'){
    staffPw=''; staffTk='';
    try{ sessionStorage.removeItem('kyk2StaffPw'); sessionStorage.removeItem('kyk2StaffTk'); }catch(e){}
    renderStaffBox();
  }
});

var SEC_PATTERNS = [['하늘','#38bdf8'],['주황','#fb923c'],['보라','#a78bfa'],['초록','#34d399'],['분홍','#f472b6'],['금색','#eab308']];
var timeOffset = 0;
setInterval(function(){
  var el = document.getElementById('vPat');
  if (!el) return;
  var p = SEC_PATTERNS[Math.floor((Date.now() + timeOffset) / 30000) % SEC_PATTERNS.length];
  el.innerHTML = '<i style="background:' + p[1] + '"></i>지금 보안 패턴 · ' + p[0];
}, 1000);

document.addEventListener('visibilitychange', function(){ if (!document.hidden) refreshStates(); });

$('#form').addEventListener('submit', function(ev){ ev.preventDefault(); check($('#inCode').value); });

/* QR 링크(?c=코드) 자동 검증 */
var c = new URLSearchParams(location.search).get('c');
if (c){ $('#inCode').value = T.fmtCode(c); check(c); }
})();
</script>
</body>
</html>
